[mcu]
serial: /dev/serial0
baud: 115200
restart_method: command

[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000

[tmc2209 manual_stepper bt_lane1]
uart_pin: gpio18
uart_address: 0
diag_pin: ^gpio5
run_current: 1
hold_current: 0.20
stealthchop_threshold: 0
coolstep_threshold: 8
driver_SGTHRS: 70

[manual_stepper bt_lane1]
step_pin: gpio2
dir_pin: gpio3
enable_pin: !gpio4
velocity: 50
accel: 200
microsteps: 16
rotation_distance: 4.6
endstop_pin: tmc2209_bt_lane1:virtual_endstop

[tmc2209 manual_stepper bt_lane2]
uart_pin: gpio18
uart_address: 1
diag_pin: ^gpio9
run_current: 1
hold_current: 0.20
stealthchop_threshold: 0
coolstep_threshold: 8
driver_SGTHRS: 70

[manual_stepper bt_lane2]
step_pin: gpio6
dir_pin: gpio7
enable_pin: !gpio8
velocity: 50
accel: 200
microsteps: 16
rotation_distance: 4.6

endstop_pin: tmc2209_bt_lane2:virtual_endstop
[tmc2209 manual_stepper bt_lane3]
uart_pin: gpio18
uart_address: 2
diag_pin: ^gpio13
run_current: 1
hold_current: 0.20
stealthchop_threshold: 0
coolstep_threshold: 8
driver_SGTHRS: 70

[manual_stepper bt_lane3]
step_pin: gpio10
dir_pin: gpio11
enable_pin: !gpio12
velocity: 50
accel: 200
microsteps: 16
rotation_distance: 4.6

endstop_pin: tmc2209_bt_lane3:virtual_endstop
[tmc2209 manual_stepper bt_lane4]
uart_pin: gpio18
uart_address: 3
diag_pin: ^gpio17
run_current: 1
hold_current: 0.20
stealthchop_threshold: 0
coolstep_threshold: 8
driver_SGTHRS: 70

[manual_stepper bt_lane4]
step_pin: gpio14
dir_pin: gpio15
enable_pin: !gpio16
velocity: 50
accel: 200
microsteps: 16
rotation_distance: 4.6
endstop_pin: tmc2209_bt_lane4:virtual_endstop

[filament_switch_sensor l1_gsw]
switch_pin: ^gpio28
pause_on_runout: False
event_delay: 0.10
insert_gcode:
  RESPOND PREFIX="SC" MSG="AUTO-GRAB L1 (GSW)"
  SAVE_VARIABLE VARIABLE=need_lth1 VALUE=1
  G4 P100
  SCLPRELOAD LANE=1 FORCE=1
  SC_TRY_LTH LANE=1
[filament_switch_sensor l4_gsw]
switch_pin: ^gpio34
pause_on_runout: False
event_delay: 0.10
insert_gcode:
  QUERY_ENDSTOPS
  LED_P4 R=1.0 G=1.0 B=0.0
  RESPOND PREFIX="SC" MSG="AUTO-GRAB L4 (GSW)"
  SAVE_VARIABLE VARIABLE=need_lth4 VALUE=1
  G4 P100
  SCLPRELOAD LANE=4 FORCE=1
  LED_P4 R=0.0 G=0.8 B=0.0
  SC_TRY_LTH LANE=4
[filament_switch_sensor l3_gsw]
switch_pin: ^gpio32
pause_on_runout: False
event_delay: 0.10
insert_gcode:
  RESPOND PREFIX="SC" MSG="AUTO-GRAB L3 (GSW)"
  SAVE_VARIABLE VARIABLE=need_lth3 VALUE=1
  G4 P100
  SCLPRELOAD LANE=3 FORCE=1
  SC_TRY_LTH LANE=3
[filament_switch_sensor l2_gsw]
switch_pin: ^gpio36
pause_on_runout: False
event_delay: 0.10
insert_gcode:
  RESPOND PREFIX="SC" MSG="AUTO-GRAB L2 (GSW)"
  SAVE_VARIABLE VARIABLE=need_lth2 VALUE=1
  G4 P100
  SCLPRELOAD LANE=2 FORCE=1
  SC_TRY_LTH LANE=2
[neopixel status_led]
pin: gpio39
chain_count: 4
color_order: GRB
initial_RED: 0.0
initial_GREEN: .5
initial_BLUE: 0.0

[gcode_macro LED_P1]
description: "Set status_led pixel 1"
variable_red: 0.0
variable_green: 0.5
variable_blue: 0.0
gcode:
  {% set r = params.R|default(printer["gcode_macro LED_P1"].red)|float %}
  {% set g = params.G|default(printer["gcode_macro LED_P1"].green)|float %}
  {% set b = params.B|default(printer["gcode_macro LED_P1"].blue)|float %}
  SET_LED LED=status_led INDEX=1 RED={r} GREEN={g} BLUE={b} TRANSMIT=1

[gcode_macro LED_P2]
description: "Set status_led pixel 2"
variable_red: 0.0
variable_green: 0.0
variable_blue: 0.0
gcode:
  {% set r = params.R|default(printer["gcode_macro LED_P2"].red)|float %}
  {% set g = params.G|default(printer["gcode_macro LED_P2"].green)|float %}
  {% set b = params.B|default(printer["gcode_macro LED_P2"].blue)|float %}
  SET_LED LED=status_led INDEX=2 RED={r} GREEN={g} BLUE={b} TRANSMIT=1

[gcode_macro LED_P3]
description: "Set status_led pixel 3"
variable_red: 0.0
variable_green: 0.0
variable_blue: 0.0
gcode:
  {% set r = params.R|default(printer["gcode_macro LED_P3"].red)|float %}
  {% set g = params.G|default(printer["gcode_macro LED_P3"].green)|float %}
  {% set b = params.B|default(printer["gcode_macro LED_P3"].blue)|float %}
  SET_LED LED=status_led INDEX=3 RED={r} GREEN={g} BLUE={b} TRANSMIT=1

[gcode_macro LED_P4]
description: "Set status_led pixel 4"
variable_red: 0.0
variable_green: 0.0
variable_blue: 0.0
gcode:
  {% set r = params.R|default(printer["gcode_macro LED_P4"].red)|float %}
  {% set g = params.G|default(printer["gcode_macro LED_P4"].green)|float %}
  {% set b = params.B|default(printer["gcode_macro LED_P4"].blue)|float %}
  SET_LED LED=status_led INDEX=4 RED={r} GREEN={g} BLUE={b} TRANSMIT=1

[gcode_macro LED_ALL_OFF]
description: "Turn all 4 pixels off"
gcode:
  SET_LED LED=status_led RED=0 GREEN=0 BLUE=0

[include aux/dup_pins.cfg]
[load_cell l1_scale]
