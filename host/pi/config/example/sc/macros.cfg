[gcode_macro SC_AUTOKICK_ENABLE]
description: Enable auto-kick of queued lanes when hub frees.
gcode:
  SAVE_VARIABLE VARIABLE=sc_autokick VALUE=1
  RESPOND PREFIX="SC" MSG="AUTO-KICK enabled"

[gcode_macro SC_AUTOKICK_DISABLE]
description: Disable auto-kick of queued lanes when hub frees.
gcode:
  SAVE_VARIABLE VARIABLE=sc_autokick VALUE=0
  RESPOND PREFIX="SC" MSG="AUTO-KICK disabled"

[gcode_macro SC_TRY_LTH_PENDING]
description: If hub is free and autokick enabled, attempt AUTO-LTH for the first queued lane (need_lthX=1 + GSW=1).
gcode:
  {% set ak = printer.save_variables.variables.sc_autokick|default(1)|int %}
  {% if ak == 0 %}
  {% else %}
    {% set owner = printer.save_variables.variables.hub_owner|default(0)|int %}
    {% if owner != 0 %}
    {% else %}
      {% set n1 = printer.save_variables.variables.need_lth1|default(0)|int %}
      {% set n2 = printer.save_variables.variables.need_lth2|default(0)|int %}
      {% set n3 = printer.save_variables.variables.need_lth3|default(0)|int %}
      {% set n4 = printer.save_variables.variables.need_lth4|default(0)|int %}
      {% set g1 = printer["filament_switch_sensor l1_gsw"].filament_detected|default(False) %}
      {% set g2 = printer["filament_switch_sensor l2_gsw"].filament_detected|default(False) %}
      {% set g3 = printer["filament_switch_sensor l3_gsw"].filament_detected|default(False) %}
      {% set g4 = printer["filament_switch_sensor l4_gsw"].filament_detected|default(False) %}

      {% if g1 and n1 != 0 %}
        SC_TRY_LTH LANE=1
      {% elif g2 and n2 != 0 %}
        SC_TRY_LTH LANE=2
      {% elif g3 and n3 != 0 %}
        SC_TRY_LTH LANE=3
      {% elif g4 and n4 != 0 %}
        SC_TRY_LTH LANE=4
      {% else %}
      {% endif %}
    {% endif %}
  {% endif %}

[delayed_gcode SC_TRY_LTH_PENDING_DO]
gcode:
  SC_TRY_LTH_PENDING

[gcode_macro RSPLR_STOP]
description: Stop one lane (coast). Usage: RSPLR_STOP LANE=1
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% set in1 = "rsplr_l%d_in1" % lane %}
  {% set in2 = "rsplr_l%d_in2" % lane %}
  SET_PIN PIN={in1} VALUE=0.0
  SET_PIN PIN={in2} VALUE=0.0

[gcode_macro RSPLR_RUN]
description: Run one lane. Usage: RSPLR_RUN LANE=1 RUN=0.15 DIR=0 (DIR 0=fwd, 1=rev)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% set dir  = params.DIR|default(0)|int %}
  {% set run  = params.RUN|default(0.15)|float %}

  {% if run < 0.0 %}{% set run = 0.0 %}{% endif %}
  {% if run > 1.0 %}{% set run = 1.0 %}{% endif %}

  {% set in1 = "rsplr_l%d_in1" % lane %}
  {% set in2 = "rsplr_l%d_in2" % lane %}

  SET_PIN PIN={in1} VALUE=0.0
  SET_PIN PIN={in2} VALUE=0.0

  {% if run <= 0.0 %}
  {% elif dir == 0 %}
    SET_PIN PIN={in1} VALUE={run}
  {% else %}
    SET_PIN PIN={in2} VALUE={run}
  {% endif %}

[gcode_macro RSPLR_START_ONE]
description: Start lane 1 at RUN duty (0..1). Usage: RSPLR_START_ONE RUN=0.15
gcode:
  {% set run = params.RUN|default(0.15)|float %}
  RSPLR_RUN LANE=1 RUN={run} DIR=0

[gcode_macro RSPLR_START_TWO]
description: Start lane 2 at RUN duty (0..1). Usage: RSPLR_START_TWO RUN=0.15
gcode:
  {% set run = params.RUN|default(0.15)|float %}
  RSPLR_RUN LANE=2 RUN={run} DIR=0

