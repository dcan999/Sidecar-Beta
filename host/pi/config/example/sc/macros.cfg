  RSPLR_RUN LANE=3 RUN={run} DIR=0

[gcode_macro RSPLR_START_FOUR]
description: Start lane 4 at RUN duty (0..1). Usage: RSPLR_START_FOUR RUN=0.15
gcode:
  {% set run = params.RUN|default(0.15)|float %}
  RSPLR_RUN LANE=4 RUN={run} DIR=0

[gcode_macro RSPLR_STOP_ONE]
gcode:
  RSPLR_STOP LANE=1

[gcode_macro RSPLR_STOP_TWO]
gcode:
  RSPLR_STOP LANE=2

[gcode_macro RSPLR_STOP_THREE]
gcode:
  RSPLR_STOP LANE=3

[gcode_macro RSPLR_STOP_FOUR]
gcode:
  RSPLR_STOP LANE=4
