  {% endif %}

[delayed_gcode LTCALREPORT1]
gcode:
  {% set PREFILL = printer['gcode_macro LTCALMEAS1'].run_prefill|float %}
  {% set KNOWN   = printer['gcode_macro LTCALMEAS1'].run_known|float %}
  {% set MARGIN  = printer['gcode_macro LTCALMEAS1'].run_margin|float %}
  {% set seekpos = printer['manual_stepper bt_lane1'].position|float %}
  {% set contact = PREFILL + seekpos %}
  {% set x_est   = contact - KNOWN %}
  {% set BACK    = printer['gcode_macro LTCALMEAS1'].run_backoff|float %}

  RESPOND PREFIX="LTCAL" MSG="MEAS: prefill={('%.1f'|format(PREFILL))} + seekpos={('%.1f'|format(seekpos))} => HSW->contact={('%.1f'|format(contact))}mm. (KNOWN={('%.1f'|format(KNOWN))}, margin={('%.1f'|format(MARGIN))}) => est(HSW->U1_inlet)≈{('%.1f'|format(x_est))}mm"

  MANUAL_STEPPER STEPPER=bt_lane1 SET_POSITION=0
  MANUAL_STEPPER STEPPER=bt_lane1 MOVE={-BACK} SPEED=50

