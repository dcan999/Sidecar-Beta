  {% set hsw_state = "TRIGGERED" if hsw_trig else "open" %}

  {% if owner != 1 %}
    RESPOND PREFIX="UNLOADL1" MSG="Blocked: hub_owner={owner}. Lane1 does not own hub (HSW={hsw_state})."
  {% else %}
    {% if not hsw_trig %}
      RESPOND PREFIX="UNLOADL1" MSG="HSW already open -> lane1 already hub-clear. Clearing hub_owner."
      SAVE_VARIABLE VARIABLE=hub_owner VALUE=0
    {% else %}
      RESPOND PREFIX="UNLOADL1" MSG="Unloading lane1: retract until HSW opens + extra, then clear hub_owner."
      SCLUNLOAD OPENMOVE=2000 EXTRA=80 SPEED=12 ACCEL=600
      SAVE_VARIABLE VARIABLE=hub_owner VALUE=0
    {% endif %}
  {% endif %}

