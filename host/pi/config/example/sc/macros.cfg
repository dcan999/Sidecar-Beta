[gcode_macro BFSTAT1]
variable_enable: 0
variable_period_s: 0.25
variable_unit: 1
variable_fill_move_mm: 250.0   # SAFETY CAP: max feed distance per fill attempt
variable_speed: 20.0
variable_accel: 800.0
variable_last_tension: 0
variable_cooldown: 0
variable_min_interval_s: 0.80   # ignore new edges for this long after a fill starts
gcode:
  RESPOND PREFIX="BFFILL1" MSG="enable={printer['gcode_macro BFSTAT1'].enable|int} period_s={printer['gcode_macro BFSTAT1'].period_s} fill_move_mm={printer['gcode_macro BFSTAT1'].fill_move_mm} speed={printer['gcode_macro BFSTAT1'].speed} accel={printer['gcode_macro BFSTAT1'].accel} last_tension={printer['gcode_macro BFSTAT1'].last_tension|int} cooldown={printer['gcode_macro BFSTAT1'].cooldown|int} min_interval_s={printer['gcode_macro BFSTAT1'].min_interval_s}"

[gcode_macro BFSTART1]
gcode:
  {% set unit = params.UNIT|default(1)|int %}
  {% set key = "hub_owner" if unit == 1 else "hub_owner" ~ unit %}
  {% set owner = printer.save_variables.variables[key]|default(0)|int %}

  SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=unit VALUE={unit}

  {% if owner != 1 %}
    RESPOND PREFIX="BFFILL1" MSG="BFSTART1 blocked: unit={unit} hub_owner={owner} (need 1)"
  {% else %}
    SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=enable VALUE=1
    SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=cooldown VALUE=0
    _BFONCE1
    UPDATE_DELAYED_GCODE ID=BFFILL1_TICK DURATION=0.05
    RESPOND PREFIX="BFFILL1" MSG="START unit={unit}"
  {% endif %}

[gcode_macro BFSTOP1]
gcode:
  SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=enable VALUE=0
  UPDATE_DELAYED_GCODE ID=BFFILL1_TICK DURATION=0
  UPDATE_DELAYED_GCODE ID=BFFILL1_COOLDOWN DURATION=0
  SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=cooldown VALUE=0
  RESPOND PREFIX="BFFILL1" MSG="STOP"

[gcode_macro _BFONCE1]
gcode:
  {% set unit = printer["gcode_macro BFSTAT1"].unit|default(1)|int %}
  {% set tens = "bftenssw" if unit == 1 else "aux" ~ unit ~ "_bftenssw" %}
  {% set home = "SCLHOME" if unit == 1 else "SCLHOME" ~ unit %}
  {% set t = printer["filament_switch_sensor " ~ tens].filament_detected|int %}
  {% set cd = printer["gcode_macro BFSTAT1"].cooldown|int %}
  {% set mv = params.MOVE|default(printer["gcode_macro BFSTAT1"].fill_move_mm)|float %}
  {% set sp = params.SPEED|default(printer["gcode_macro BFSTAT1"].speed)|float %}
  {% set ac = params.ACCEL|default(printer["gcode_macro BFSTAT1"].accel)|float %}

  SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=last_tension VALUE={t}

  {% if t %}
    {% if cd %}
      RESPOND PREFIX="BFFILL1" MSG="ONCE: tension=CLOSED but in cooldown -> ignored"
    {% else %}
      SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=cooldown VALUE=1
      UPDATE_DELAYED_GCODE ID=BFFILL1_COOLDOWN DURATION={printer["gcode_macro BFSTAT1"].min_interval_s}

      RESPOND PREFIX="BFFILL1" MSG="ONCE: tension=CLOSED -> fill until BFCOMPSW (mv={mv} sp={sp})"
      {home} ENDSTOP=BFCOMPSW MOVE={mv} SPEED={sp} ACCEL={ac} STOP=1
    {% endif %}
  {% else %}
    RESPOND PREFIX="BFFILL1" MSG="ONCE: tension=open -> no action"
  {% endif %}

[delayed_gcode BFFILL1_COOLDOWN]
gcode:
  SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=cooldown VALUE=0
  RESPOND PREFIX="BFFILL1" MSG="cooldown cleared"

[delayed_gcode BFFILL1_TICK]
gcode:
  {% set en = printer["gcode_macro BFSTAT1"].enable|int %}
  {% if en %}
    {% set unit = printer["gcode_macro BFSTAT1"].unit|default(1)|int %}
    {% set tens = "bftenssw" if unit == 1 else "aux" ~ unit ~ "_bftenssw" %}
    {% set home = "SCLHOME" if unit == 1 else "SCLHOME" ~ unit %}
    {% set t = printer["filament_switch_sensor " ~ tens].filament_detected|int %}
    {% set lt = printer["gcode_macro BFSTAT1"].last_tension|int %}
    {% set cd = printer["gcode_macro BFSTAT1"].cooldown|int %}

    SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=last_tension VALUE={t}

    {% if (t == 1) and (lt == 0) %}
      {% if cd %}
        RESPOND PREFIX="BFFILL1" MSG="EDGE: tension CLOSED but in cooldown -> ignored"
      {% else %}
        SET_GCODE_VARIABLE MACRO=BFSTAT1 VARIABLE=cooldown VALUE=1
        UPDATE_DELAYED_GCODE ID=BFFILL1_COOLDOWN DURATION={printer["gcode_macro BFSTAT1"].min_interval_s}

        {% set mv = printer["gcode_macro BFSTAT1"].fill_move_mm|float %}
        {% set sp = printer["gcode_macro BFSTAT1"].speed|float %}
        {% set ac = printer["gcode_macro BFSTAT1"].accel|float %}
        RESPOND PREFIX="BFFILL1" MSG="EDGE: tension CLOSED -> fill until BFCOMPSW (mv={mv} sp={sp})"
        {home} ENDSTOP=BFCOMPSW MOVE={mv} SPEED={sp} ACCEL={ac} STOP=1
      {% endif %}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=BFFILL1_TICK DURATION={printer["gcode_macro BFSTAT1"].period_s}
  {% endif %}

[delayed_gcode SC_UNLOAD_DO1]
gcode:
  {% set owner = printer.save_variables.variables.hub_owner|default(0)|int %}
  {% set hsw_trig = printer["query_endstops"].last_query["HSW"]|default(False) %}

  {% set RSPEED   = printer["gcode_macro UNLOADL1"].rspeed|float %}
  {% set OPENMOVE = printer["gcode_macro UNLOADL1"].openmove|float %}
  {% set ACCEL    = printer["gcode_macro UNLOADL1"].accel|float %}
  {% set EXTRA    = printer["gcode_macro UNLOADL1"].extra|float %}

  {% if owner != 1 %}
    RSPLR_STOP LANE=1
  RESPOND PREFIX="UNLOADL1" MSG="Blocked: hub_owner={owner}. Lane1 does not own hub (HSW={'TRIGGERED' if hsw_trig else 'open'})."
  {% else %}
    {% if not hsw_trig %}
      RESPOND PREFIX="UNLOADL1" MSG="HSW open -> lane1 already hub-clear. Clearing hub_owner."
      SAVE_VARIABLE VARIABLE=hub_owner VALUE=0
      RSPLR_STOP LANE=1
    {% else %}
      RESPOND PREFIX="UNLOADL1" MSG="Unloading: retract until HSW opens + extra (RSPEED={RSPEED} EXTRA={EXTRA})."
      SCLUNLOAD OPENMOVE={OPENMOVE} EXTRA={EXTRA} SPEED={RSPEED} ACCEL={ACCEL}
