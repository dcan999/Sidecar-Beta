[gcode_macro SC_TRY_LTH]
description: "After preload: refresh endstops, then attempt LTH if hub free & RSW staged. Params: LANE=1..4"
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% if lane < 1 or lane > 4 %}
    {action_raise_error("SC_TRY_LTH: invalid LANE")}
  {% endif %}
  {% if lane == 1 %}
    UPDATE_DELAYED_GCODE ID=SC_TRY_LTH_DO1 DURATION=0.01
  {% elif lane == 2 %}
    UPDATE_DELAYED_GCODE ID=SC_TRY_LTH_DO2 DURATION=0.01
  {% elif lane == 3 %}
    UPDATE_DELAYED_GCODE ID=SC_TRY_LTH_DO3 DURATION=0.01
  {% else %}
    UPDATE_DELAYED_GCODE ID=SC_TRY_LTH_DO4 DURATION=0.01
  {% endif %}
[gcode_macro SC_ENSURE_LTH]
description: "Ensure LTH has been done for lane before LTGL. Errors if RSW not staged. Params: LANE=1..4"
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% if lane < 1 or lane > 4 %}
    {action_raise_error("SC_ENSURE_LTH: invalid LANE")}
  {% endif %}

  QUERY_ENDSTOPS
  G4 P50
  QUERY_ENDSTOPS
  G4 P50

  {% set q = printer["query_endstops"].last_query %}
  {% set key = "RSW" if lane == 1 else ("L" ~ lane ~ "RSW") %}
  {% set rsw = (q[key]|default(0))|int %}

  {% if rsw == 0 %}
    {action_raise_error("SC_ENSURE_LTH: RSW open (run preload first)")}
  {% endif %}

  {% if lane == 1 %}
    LTHL1
    SAVE_VARIABLE VARIABLE=need_lth1 VALUE=0
  {% elif lane == 2 %}
    LTHL2
    SAVE_VARIABLE VARIABLE=need_lth2 VALUE=0
  {% elif lane == 3 %}
    LTHL3
