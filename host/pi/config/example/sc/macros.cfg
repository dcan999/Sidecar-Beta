[delayed_gcode SC_TRY_LTH_DO1B]
gcode:
  {% set q = printer["query_endstops"].last_query %}
  {% set owner = printer.save_variables.variables.hub_owner|default(0)|int %}
  {% set hsw = (q["HSW"]|default(0))|int %}
  {% set rsw = (q["RSW"]|default(0))|int %}

  {% if rsw == 0 %}
    RESPOND PREFIX="SC" MSG="AUTO-LTH defer lane=1 reason=rsw_open key=RSW"
  {% elif owner != 0 %}
    RESPOND PREFIX="SC" MSG="AUTO-LTH defer lane=1 reason=hub_owner owner={owner}"
  {% elif hsw != 0 %}
    RESPOND PREFIX="SC" MSG="AUTO-LTH defer lane=1 reason=hsw_triggered"
  {% else %}
    RESPOND PREFIX="SC" MSG="AUTO-LTH attempt lane=1"
    LTHL1
    SAVE_VARIABLE VARIABLE=need_lth1 VALUE=0
  {% endif %}

