[gcode_macro UNLOADL1]
description: Unload Lane1 (retract until HSW opens + extra) + tuning boxes
variable_rspeed: 175.0
variable_openmove: 2000.0
variable_accel: 200.0
variable_extra: 50.0
variable_rspdir: 0.0
gcode:
  {% set RSPEED   = params.RSPEED|default(params.SPEED|default(printer["gcode_macro UNLOADL1"].rspeed))|float %}
  {% set OPENMOVE = params.OPENMOVE|default(printer["gcode_macro UNLOADL1"].openmove)|float %}
  {% set ACCEL    = params.ACCEL|default(printer["gcode_macro UNLOADL1"].accel)|float %}
  {% set EXTRA    = params.EXTRA|default(printer["gcode_macro UNLOADL1"].extra)|float %}

  SET_GCODE_VARIABLE MACRO=UNLOADL1 VARIABLE=rspeed   VALUE={RSPEED}
  SET_GCODE_VARIABLE MACRO=UNLOADL1 VARIABLE=openmove VALUE={OPENMOVE}
  SET_GCODE_VARIABLE MACRO=UNLOADL1 VARIABLE=accel    VALUE={ACCEL}
  SET_GCODE_VARIABLE MACRO=UNLOADL1 VARIABLE=extra    VALUE={EXTRA}

  {% set RSPDIR = printer["gcode_macro UNLOADL1"].rspdir|default(0.0)|float %}
  RSPLR_RUN LANE=1 RUN=1.0 DIR={RSPDIR|int}

  QUERY_ENDSTOPS
  UPDATE_DELAYED_GCODE ID=SC_UNLOAD_DO1 DURATION=0.01

