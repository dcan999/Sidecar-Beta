[gcode_macro REMOVEL1]
description: "Lane1 remove spool (open RSW if needed, then extra retract)"
gcode:
  SCLED_SET LANE=1 MODE=REMOVE_BLUE TIMEOUT=300
  {% set SPEED = params.SPEED|default(150)|float %}
  {% set ACCEL = params.ACCEL|default(200)|float %}
  {% set EXTRA = params.EXTRA|default(30)|float %}
  RSPLR_RUN LANE=1 RUN=0.60 DIR=0
  SCLREMOVE SPEED={SPEED} ACCEL={ACCEL} EXTRA={EXTRA}
  {% set owner = printer.save_variables.variables.hub_owner|default(0)|int %}
  {% if owner == 1 %}
    SAVE_VARIABLE VARIABLE=hub_owner VALUE=0
  {% endif %}
  {% set ag = printer.save_variables.variables.at_gears|default(0)|int %}
  {% if ag == 1 %}
    SAVE_VARIABLE VARIABLE=at_gears VALUE=0
  {% endif %}
  SCLED_SET LANE=1 MODE=REMOVE_ORANGE TIMEOUT=600
  RSPLR_STOP LANE=1
