[gcode_macro STATUSL1]
description: "Lane1 status (GSW + endstops)"
gcode:
  SCSTATUS1
  QUERY_ENDSTOPS

[gcode_macro DISABLEL1]
description: "Lane1 DISABLE (panic stop power to lane stepper)"
gcode:
  SCDIS1

[gcode_macro _FWDL1]
description: "Lane1 jog forward +MM (default 10) SPEED (default 5)"
gcode:
  {% set MM = params.MM|default(10)|float %}
  {% set SPEED = params.SPEED|default(5)|float %}
  SCFWD1 MM={MM} SPEED={SPEED}

[gcode_macro _REVL1]
description: "Lane1 jog reverse -MM (default 10) SPEED (default 5)"
gcode:
  {% set MM = params.MM|default(10)|float %}
  {% set SPEED = params.SPEED|default(5)|float %}
  SCREV1 MM={MM} SPEED={SPEED}

[gcode_macro LTGL1]
description: Load to gears (Lane 1, 3-phase) + tuning boxes
variable_csthr: 8.0
variable_sgthrs: 64
variable_pregear: 1285
variable_seek_move: 200.0
variable_speed_fast: 150
variable_speed_hsw: 150
variable_speed_sg: 10.0
variable_accel: 400.0
gcode:
  SAVE_VARIABLE VARIABLE=at_gears VALUE=0
  SC_HUB_FREE LANE=1
  {% set ACCEL = params.ACCEL|default(printer["gcode_macro LTGL1"].accel)|float %}

  {% set SPEED_HSW  = params.SPEED_HSW|default(printer["gcode_macro LTGL1"].speed_hsw)|float %}
  {% set SPEED_FAST = params.SPEED_FAST|default(printer["gcode_macro LTGL1"].speed_fast)|float %}
  {% set SPEED_SG   = params.SPEED_SG|default(printer["gcode_macro LTGL1"].speed_sg)|float %}

  {% set PREGEAR   = params.PREGEAR|default(printer["gcode_macro LTGL1"].pregear)|float %}
  {% set SEEK_MOVE = params.SEEK_MOVE|default(printer["gcode_macro LTGL1"].seek_move)|float %}

  {% set SGTHRS = params.SGTHRS|default(printer["gcode_macro LTGL1"].sgthrs)|int %}
  {% set CSTHR  = params.CSTHR|default(printer["gcode_macro LTGL1"].csthr)|float %}

  {% set TOHSW_MOVE = params.TOHSW_MOVE|default(2000)|float %}

  MANUAL_STEPPER STEPPER=bt_lane1 ENABLE=1

  SCLHOME LANE=1 ENDSTOP=HSW STOP=1 MOVE={TOHSW_MOVE} SPEED={SPEED_HSW} ACCEL={ACCEL}

  SAVE_VARIABLE VARIABLE=hub_owner VALUE=1

  MANUAL_STEPPER STEPPER=bt_lane1 SET_POSITION=0

  MANUAL_STEPPER STEPPER=bt_lane1 MOVE={PREGEAR} SPEED={SPEED_FAST} ACCEL={ACCEL}

  MANUAL_STEPPER STEPPER=bt_lane1 SET_POSITION=0

  {% if CSTHR > 0.0 %}
    {% set rot  = printer.configfile.settings["manual_stepper bt_lane1"].rotation_distance|float %}
    {% set micro= printer.configfile.settings["manual_stepper bt_lane1"].microsteps|int %}
    {% set steps_rev = printer.configfile.settings["manual_stepper bt_lane1"].full_steps_per_rotation|default(200)|int %}
    {% set steps_per_mm = (steps_rev * micro) / rot %}
    {% set fclk = 12000000.0 %}
    {% set tcool = (fclk / (CSTHR * steps_per_mm))|int %}
    SET_TMC_FIELD STEPPER=bt_lane1 FIELD=TCOOLTHRS VALUE={tcool}
  {% endif %}

  SET_TMC_FIELD STEPPER=bt_lane1 FIELD=SGTHRS VALUE={SGTHRS}
  MANUAL_STEPPER STEPPER=bt_lane1 MOVE={SEEK_MOVE} SPEED={SPEED_SG} ACCEL={ACCEL} STOP_ON_ENDSTOP=1

  RESPOND PREFIX="LTG" MSG="LTGL1: CSTHR={CSTHR} SGTHRS={SGTHRS} PREGEAR={PREGEAR} SEEK={SEEK_MOVE} VFAST={SPEED_FAST} VHSW={SPEED_HSW} VSG={SPEED_SG}"
  SAVE_VARIABLE VARIABLE=at_gears VALUE=1
  RESPOND PREFIX="LTGL1" MSG="AT_GEARS=1"

