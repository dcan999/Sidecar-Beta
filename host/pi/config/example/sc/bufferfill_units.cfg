[gcode_macro BFUSTATU1]
variable_enable: 0
variable_period_s: 0.25
variable_fill_move_mm: 250.0
variable_speed: 20.0
variable_accel: 800.0
variable_last_tension: 0
variable_cooldown: 0
variable_min_interval_s: 0.80
gcode:
  RESPOND PREFIX="BFFILLU1" MSG="enable={printer['gcode_macro BFUSTATU1'].enable|int} cooldown={printer['gcode_macro BFUSTATU1'].cooldown|int} last_tension={printer['gcode_macro BFUSTATU1'].last_tension|int}"

[gcode_macro BFU_START1]
gcode:
  SAVE_VARIABLE VARIABLE=bfu_inhibit VALUE=0
  SET_GCODE_VARIABLE MACRO=BFUSTATU1 VARIABLE=enable VALUE=1
  SET_GCODE_VARIABLE MACRO=BFUSTATU1 VARIABLE=cooldown VALUE=0
  _BFU_ONCE1
  UPDATE_DELAYED_GCODE ID=BFFILLU1_TICK DURATION=0.05
  RESPOND PREFIX="BFFILLU1" MSG="START"

[gcode_macro BFU_STOP1]
gcode:
  SET_GCODE_VARIABLE MACRO=BFUSTATU1 VARIABLE=enable VALUE=0
  UPDATE_DELAYED_GCODE ID=BFFILLU1_TICK DURATION=0
  UPDATE_DELAYED_GCODE ID=BFFILLU1_COOLDOWN DURATION=0
  SET_GCODE_VARIABLE MACRO=BFUSTATU1 VARIABLE=cooldown VALUE=0
  RESPOND PREFIX="BFFILLU1" MSG="STOP"

[gcode_macro _BFU_ONCE1]
gcode:
  {% set inh = printer.save_variables.variables["bfu_inhibit"]|default(0)|int %}
  {% if inh %}
  {% else %}
    {% set t = printer["filament_switch_sensor bftenssw"].filament_detected|int %}
    {% set cd = printer["gcode_macro BFUSTATU1"].cooldown|int %}
    {% set owner = printer.save_variables.variables["hub_owner"]|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=BFUSTATU1 VARIABLE=last_tension VALUE={t}

    {% if owner not in (1,2,3,4) %}
      RESPOND PREFIX="BFFILLU1" MSG="ONCE: no owner (hub_owner={owner}) -> no action"
    {% elif t == 1 %}
      {% if cd %}
        RESPOND PREFIX="BFFILLU1" MSG="ONCE: tension=CLOSED but cooldown -> ignored"
      {% else %}
        SET_GCODE_VARIABLE MACRO=BFUSTATU1 VARIABLE=cooldown VALUE=1
        UPDATE_DELAYED_GCODE ID=BFFILLU1_COOLDOWN DURATION={printer["gcode_macro BFUSTATU1"].min_interval_s}
        {% set mv = printer["gcode_macro BFUSTATU1"].fill_move_mm|float %}
        {% set sp = printer["gcode_macro BFUSTATU1"].speed|float %}
        {% set ac = printer["gcode_macro BFUSTATU1"].accel|float %}
        RESPOND PREFIX="BFFILLU1" MSG="ONCE: tension=CLOSED owner={owner} -> fill until BFCOMPSW (mv={mv} sp={sp})"
        SCLHOME LANE={owner} ENDSTOP=BFCOMPSW MOVE={mv} SPEED={sp} ACCEL={ac} STOP=1
      {% endif %}
    {% else %}
      RESPOND PREFIX="BFFILLU1" MSG="ONCE: tension=open -> no action"
    {% endif %}
  {% endif %}

[delayed_gcode BFFILLU1_COOLDOWN]
gcode:
  SET_GCODE_VARIABLE MACRO=BFUSTATU1 VARIABLE=cooldown VALUE=0
  RESPOND PREFIX="BFFILLU1" MSG="cooldown cleared"

[delayed_gcode BFFILLU1_TICK]
gcode:
  {% if printer["gcode_macro BFUSTATU1"].enable|int %}
    {% set inh = printer.save_variables.variables["bfu_inhibit"]|default(0)|int %}
    {% if inh %}
    {% else %}
      {% set t = printer["filament_switch_sensor bftenssw"].filament_detected|int %}
      {% set lt = printer["gcode_macro BFUSTATU1"].last_tension|int %}
      {% set cd = printer["gcode_macro BFUSTATU1"].cooldown|int %}
      {% set owner = printer.save_variables.variables["hub_owner"]|default(0)|int %}
      SET_GCODE_VARIABLE MACRO=BFUSTATU1 VARIABLE=last_tension VALUE={t}

      {% if (owner in (1,2,3,4)) and (t == 1) and (lt == 0) %}
        {% if cd %}
          RESPOND PREFIX="BFFILLU1" MSG="EDGE: tension CLOSED but cooldown -> ignored"
        {% else %}
          SET_GCODE_VARIABLE MACRO=BFUSTATU1 VARIABLE=cooldown VALUE=1
          UPDATE_DELAYED_GCODE ID=BFFILLU1_COOLDOWN DURATION={printer["gcode_macro BFUSTATU1"].min_interval_s}
          {% set mv = printer["gcode_macro BFUSTATU1"].fill_move_mm|float %}
          {% set sp = printer["gcode_macro BFUSTATU1"].speed|float %}
          {% set ac = printer["gcode_macro BFUSTATU1"].accel|float %}
          RESPOND PREFIX="BFFILLU1" MSG="EDGE: tension CLOSED owner={owner} -> fill until BFCOMPSW (mv={mv} sp={sp})"
          SCLHOME LANE={owner} ENDSTOP=BFCOMPSW MOVE={mv} SPEED={sp} ACCEL={ac} STOP=1
        {% endif %}
      {% endif %}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=BFFILLU1_TICK DURATION={printer["gcode_macro BFUSTATU1"].period_s}
  {% endif %}

